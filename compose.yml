services:
  stocksentinel:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      STOCKSENTINEL_API_KEY: ${STOCKSENTINEL_API_KEY:?Set a strong API key in .env}
      Push__VapidSubject: ${Push__VapidSubject:?Set a public VAPID contact URI in .env}
      DOTNET_ENVIRONMENT: Production
      URLS: http://+:${STOCKSENTINEL_PORT:-8080}
      Sentinel__DatabasePath: /app/data/sentinel.db
      ReverseProxy__KnownProxy: ${STOCKSENTINEL_PROXY_IP:-127.0.0.1}
    ports:
      - "127.0.0.1:${STOCKSENTINEL_PORT:-8080}:${STOCKSENTINEL_PORT:-8080}"
    volumes:
      - stocksentinel-data:/app/data
    stop_grace_period: 45s

volumes:
  stocksentinel-data:
